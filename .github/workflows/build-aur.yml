name: Build and Release AUR Package

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest

    container:
      image: archlinux:latest

    steps:
      - name: Update Arch Linux
        run: pacman -Syu --noconfirm

      - name: Install build and release dependencies
        run: |
          pacman -S --needed --noconfirm \
            base-devel \
            git \
            github-cli \
            namcap \
            msr-tools \
            lm_sensors

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Read package metadata
        id: package
        shell: bash
        run: |
          source PKGBUILD

          echo "name=$pkgname" >> "$GITHUB_OUTPUT"
          echo "version=$pkgver" >> "$GITHUB_OUTPUT"
          echo "release=$pkgrel" >> "$GITHUB_OUTPUT"
          echo "tag=v${pkgver}" >> "$GITHUB_OUTPUT"

      - name: Ensure release tag does not already exist
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.package.outputs.tag }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists. Increment pkgver before running this workflow again."
            exit 1
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists. Increment pkgver before running this workflow again."
            exit 1
          fi

      - name: Create build user
        run: |
          useradd -m builder
          chown -R builder:builder "$GITHUB_WORKSPACE"

      - name: Verify .SRCINFO
        run: |
          su builder -c '
            cd "$GITHUB_WORKSPACE"
            makepkg --printsrcinfo > .SRCINFO.generated
            diff -u .SRCINFO .SRCINFO.generated
          '

      - name: Build package
        run: |
          su builder -c '
            cd "$GITHUB_WORKSPACE"
            makepkg --cleanbuild --noconfirm
          '

      - name: Run namcap
        continue-on-error: true
        run: |
          namcap PKGBUILD
          namcap ./*.pkg.tar.zst

      - name: Locate package
        id: artifact
        shell: bash
        env:
          PKGNAME: ${{ steps.package.outputs.name }}
        run: |
          shopt -s nullglob
          packages=(./"${PKGNAME}"-*.pkg.tar.zst)
          main_packages=()

          for package in "${packages[@]}"; do
            if [[ "$package" != ./${PKGNAME}-debug-* ]]; then
              main_packages+=("$package")
            fi
          done

          if (( ${#main_packages[@]} != 1 )); then
            echo "Expected exactly one main package, found ${#main_packages[@]}."
            printf '%s\n' "${main_packages[@]}"
            exit 1
          fi

          package="${main_packages[0]#./}"
          echo "file=$package" >> "$GITHUB_OUTPUT"
          ls -lh "$package"

      - name: Create GitHub release and attach package
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.package.outputs.tag }}
          PACKAGE_FILE: ${{ steps.artifact.outputs.file }}
        run: |
          gh release create "$TAG" "$PACKAGE_FILE" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --generate-notes \
            --latest
